type: "OTableGlobalConfig"
description: "Represents the default options for the table that can be configured using the  <a href='#O_TABLE_GLOBAL_CONFIG'>O_TABLE_GLOBAL_CONFIG</a> injection token.
<div class='language-html highlighter-rouge'>
    <div class='highlight'>
      <pre class='highlight'>
        <code>
          type OTableGlobalConfig = {
            autoAdjust: boolean;
            autoAlignTitles: boolean;
            filterColumnActiveByDefault: boolean;
            editionMode: OTableEditionMode;
            detailMode: OTableDetailMode;
            rowHeight: ORowHeight;
            selectionOnRowClick: boolean;
            showChartOnDemandOption: boolean;
            showReportOnDemandOption: boolean;
            loading: {
              threshold: number;
              minVisible: number;
            };
            horizontalScroll: boolean;
            showHeaderTooltip: boolean;
            showButtonsText: boolean;
          };
        </code>
      </pre>
    </div>
  </div>"

attributes: [{
  name: "autoAlignTitles",
  type: "false | true",
  default: "yes",
  description: "Indicates whether or not to auto align the table header cells",
  required : "",
  },{
  name: "autoAdjust",
  type: "false | true",
  default : "yes",
  required : "",
  description : "Indicates whether or not to auto adjust column width to its content."
  },{
  name: "filterColumnActiveByDefault",
  type: "false | true",
  default : "yes",
  required : "",
  description : "Indicates whether or not to active filter by column."
  },{
  name: "editionMode",
  type: "'none' | 'click' | 'dblclick' | 'doubleclick'",
  default : "'none'",
  required : "",
  description : "Indicates the edition mode."
  },{
  name: "detailMode",
  type: "'none' | 'click' | 'dblclick' | 'doubleclick'",
  default : "'click'",
  required : "",
  description : "Indicates the detail mode."
  },{
  name: "rowHeight",
  type: "'small' | 'medium' | 'large'",
  default : "'click'",
  required : "",
  description : "Indicates the row height"
  },{
  name: "horizontalScroll" ,
  type: "boolean",
  default : "false",
  required : "",
  description : "Indicates whether horizontal scroll is enabled."
  },{
  name: "selectionOnRowClick",
  type: "boolean",
  default : "",
  required : "",
  description : "Indicates whether row selection is triggered when clicking on a row."
  },{
  name: "showChartsOnDemandOption",
  type: "boolean",
  default : "true",
  required : "",
  description : "Indicates whether to show or not the 'Chart on demand' option in the table menu."
  },{
  name: "showReportOnDemandOption",
  type: "boolean",
  default : "true",
  required : "",
  description : "Indicates whether to show or not the 'Report on demand' option in the table menu."
  },{
  name: "loading",
  type: "{threshold: number, minVisible: number}",
  default : "{threshold: 300, minVisible: 300}",
  required : "",
  description : "Loading skeleton behaviour: <code>threshold</code> is the time (ms) the skeleton waits before being shown, so it does not flash on fast queries (skipped on the first load); <code>minVisible</code> is the minimum time (ms) it stays visible once shown."
},
{
  name: "showHeaderTooltip",
  type: "boolean",
  default : "false",
  required : "",
  description : "Indicates whether to show or not the tooltip on header cells."
},
{
  name: "showButtonsText",
  type: "boolean",
  default : "true",
  required : "",
  description : "Indicates whether to show or not the text label alongside the icon on the table's header buttons (insert/refresh/delete and any custom o-table-button)."
}
]

