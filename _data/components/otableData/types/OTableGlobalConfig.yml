type OTableGlobalConfig = {
  autoAdjust: boolean;
  autoAlignTitles: boolean;
  filterColumnActiveByDefault: boolean;
  editionMode: OTableEditionMode;
  detailMode: OTableDetailMode;
  rowHeight: ORowHeight
};
</code></pre></div></div>
"

