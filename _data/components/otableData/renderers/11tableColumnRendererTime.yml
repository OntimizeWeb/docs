class: "OTableCellRendererTimeComponent"

extends: "OBaseTableCellRenderer"

directive: "o-table-cell-renderer-time"
title: "Cell renderer: time"

attributes: [{
  name: "format",
  type: "string",
  default: "D HH:mm a (moment adapter: L HH:mm a)",
  required: "",
  description: "Date and time format, interpreted by the active date adapter (Luxon by default). See the Date handling guide"
}]
inherit_properties: [{
  component: "OBaseTableCellRenderer",
  path: "components/data/table/obasetablecellrenderer/api",
  properties: [{
    name: "column",
    type: "property",
    description: "Name of the column"
  },{
    name: "table",
    type: "property"
  },{
    name: "tableColumn",
    type: "property"
  },{
    name: "templateref"
  }]
}]

inheritedAttributes: [{
  component: "OBaseTableCellRenderer",
  path: "components/data/table/obasetablecellrenderer/api",
  attributes: ['filter-source', "filterFunction"]
}]